name: Deploy Staging

on:
  push:
    branches: [ staging ] 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Build Frontend Assets 
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build Frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          fi
      # 3. Deploy everything directly to public_html/staging
      - name: Deploy to Hostinger via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          # Path to the staging folder in public_html
          TARGET: "/home/${{ secrets.SSH_USERNAME }}/public_html/staging"
          SOURCE: "public/"
          # Exclude git, docker, node_modules, and .env (to avoid overwriting staging credentials)
          EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, Dockerfile*, docker-compose.yml, .env"